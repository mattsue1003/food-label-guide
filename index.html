<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食品標籤這樣看｜社區衛教互動簡報（影片法）</title>
<style>
:root{
  --orange:#E8552D; --amber:#F4A93C; --teal:#028090; --ink:#12343B;
  --sdg:#2E9E5B;
  --bg:#FBF7F0; --card:#FFFFFF; --line:#E3D9C8;
  --good:#2E7D4F; --bad:#C0392B;
  --shadow:0 6px 22px rgba(18,52,59,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  background:var(--ink); color:var(--ink); overflow:hidden;
}
#stage{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
#bar{height:8px;background:#EFE6D6;flex:0 0 auto}
#barfill{height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--orange));transition:width .3s}
#slides{flex:1 1 auto;position:relative;overflow:hidden}

/* --s 由自動縮放引擎設定：每頁把內容撐到剛好填滿畫面 */
.slide{--s:1;--hs:min(var(--s),1.16);position:absolute;inset:0;display:none;flex-direction:column;
  padding:calc(28px*var(--s)) calc(50px*var(--s)) 78px;overflow:auto}
.slide.on{display:flex;animation:in .32s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- typography ---------- */
.tag{display:inline-block;background:var(--sdg);color:#fff;font-weight:800;
  font-size:calc(22px*var(--hs));padding:.28em .9em;border-radius:999px;letter-spacing:.05em}
.tag.q{background:var(--orange)}
.tag.core{background:var(--teal)}
h2{font-size:calc(54px*var(--hs));line-height:1.22;font-weight:900;margin:.2em 0 .06em}
.lead{font-size:calc(28px*var(--hs));line-height:1.5;font-weight:600;color:#3B4F55}
.hd{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;margin-bottom:calc(16px*var(--s))}
.body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:calc(18px*var(--s))}
.src{flex:0 0 auto;padding-top:.8em;font-size:calc(15px*var(--hs));color:#8A8272;font-weight:600}
.body>.grid{flex:1 1 auto;align-content:stretch;grid-auto-rows:minmax(0,1fr)}
.body>.mv-tasks{flex:0 0 auto;grid-auto-rows:auto}
.body>.tiles{flex:1 1 auto;align-content:center}
.body>.story,.body>.blanks{flex:0 0 auto}
.story-in,.blanks-in{width:100%}
.body>.opts{flex:1 1 auto;grid-auto-rows:minmax(0,1fr)}
.opt{align-items:center}

/* ---------- cover ---------- */
.cover{background:linear-gradient(135deg,var(--ink),#0C5A63 55%,var(--teal));color:#fff;
  justify-content:center;overflow:hidden}
.cover .numwrap{position:absolute;inset:0;overflow:hidden;z-index:0}
.cover h1{color:#fff;font-size:min(14vh,10.5vw);line-height:1.04;font-weight:900;letter-spacing:-.01em}
.cover .sub{font-size:min(5.4vh,4.2vw);font-weight:700;color:#FFDCA8;margin-top:.45em}
.cover .num{position:absolute;right:-1.5vw;top:50%;transform:translateY(-50%);
  font-size:min(74vh,46vw);font-weight:900;color:rgba(244,169,60,.15);line-height:.78;
  letter-spacing:-.05em;pointer-events:none;z-index:0}
.cover .body{position:relative;z-index:1;max-width:74%}
.cover .meta{margin-top:min(4.5vh,3.4vw);font-size:min(2.4vh,1.8vw);color:#BFE3E6;font-weight:600}
.cover .kick{font-size:min(2.6vh,2vw);font-weight:800;color:#FFDCA8;letter-spacing:.06em}

/* ---------- cards ---------- */
.grid{display:grid;gap:calc(20px*var(--s))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;
  padding:calc(24px*var(--s));box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center;gap:.4em}
.card .k{font-size:calc(28px*var(--s));font-weight:900;color:var(--orange);line-height:1.25}
.card .v{font-size:calc(23px*var(--s));font-weight:600;line-height:1.5;color:#3B4F55}
.card.teal{border-color:#9ED2D6}.card.teal .k{color:var(--teal)}
.card.amber{border-color:#F6D8A0}.card.amber .k{color:#B9741C}

.stat{background:var(--card);border-radius:22px;border:3px solid var(--line);
  padding:calc(26px*var(--s));text-align:center;box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center}
.stat .n{font-size:calc(100px*var(--s));font-weight:900;color:var(--orange);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .n.long{font-size:calc(80px*var(--s))}
.stat .u{font-size:calc(27px*var(--s));font-weight:800;color:var(--ink);margin-top:.22em}
.stat .d{font-size:calc(22px*var(--s));font-weight:600;color:#6B7A7E;margin-top:.4em;line-height:1.45}

.flag{display:flex;flex-direction:column;justify-content:center;gap:.3em;background:var(--card);
  border-radius:20px;border:3px solid var(--line);padding:calc(24px*var(--s));box-shadow:var(--shadow)}
.flag .c{font-size:calc(34px*var(--s));font-weight:900;color:var(--teal)}
.flag .y{font-size:calc(19px*var(--s));font-weight:800;color:var(--amber)}
.flag .t{font-size:calc(22px*var(--s));font-weight:600;line-height:1.5;color:#3B4F55}

/* ---------- interactive ---------- */
.qtext{font-size:calc(42px*var(--hs));font-weight:900;line-height:1.32;margin-bottom:.25em}
.opts{display:grid;gap:calc(13px*var(--s));align-content:center}
.opt{display:flex;align-items:center;gap:.7em;background:var(--card);border:4px solid var(--line);
  border-radius:18px;padding:calc(20px*var(--s)) calc(28px*var(--s));cursor:pointer;
  font-size:calc(31px*var(--s));font-weight:800;line-height:1.35;text-align:left;
  transition:border-color .15s,background .15s;box-shadow:var(--shadow)}
.opt:hover{border-color:var(--amber)}
.opt .ltr{flex:0 0 auto;width:1.7em;height:1.7em;border-radius:50%;background:var(--teal);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:.85em}
.opt.right{border-color:var(--good);background:#E8F6ED}.opt.right .ltr{background:var(--good)}
.opt.wrong{border-color:var(--bad);background:#FBEBE9;opacity:.75}.opt.wrong .ltr{background:var(--bad)}
.opt.lock{cursor:default}

.fb{background:#FFF6E4;border:3px dashed var(--amber);border-radius:18px;
  padding:calc(20px*var(--s));font-size:calc(26px*var(--s));font-weight:700;line-height:1.55;color:#5A4415}
.fb.idle{background:transparent;border-color:#E7DDCB;color:#A99C86;font-weight:600;
  display:flex;align-items:center;justify-content:center;text-align:center}

/* ---------- 答案彈窗 ---------- */
#ans{position:fixed;inset:0;z-index:55;background:rgba(8,24,28,.82);display:none;
  place-items:center;padding:4vh 4vw}
#ans.on{display:grid}
.ans-card{background:var(--bg);border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.45);
  max-width:min(1150px,94vw);max-height:90vh;overflow:auto;width:100%;
  padding:clamp(26px,4vh,52px) clamp(26px,4vw,60px);text-align:center;
  display:flex;flex-direction:column;gap:clamp(12px,2vh,24px);animation:pop .28s ease}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(24px)}to{opacity:1;transform:none}}
.ans-ico{font-size:clamp(56px,10vh,110px);line-height:1}
.ans-t{font-size:clamp(30px,5vh,58px);font-weight:900;color:var(--ink)}
.ans-b{font-size:clamp(19px,3vh,33px);font-weight:700;line-height:1.7;color:#3B4F55;text-align:left;
  background:#FFF6E4;border:3px dashed var(--amber);border-radius:20px;
  padding:clamp(16px,2.4vh,30px) clamp(18px,2.4vw,34px)}
.ans-b b{color:var(--orange)}
.ans-ok{align-self:center}
.fb b{color:var(--orange)}

.tiles{display:flex;flex-wrap:wrap;gap:calc(15px*var(--s))}
.tile{background:var(--card);border:4px solid var(--line);border-radius:16px;cursor:pointer;
  padding:calc(16px*var(--s)) calc(24px*var(--s));font-size:calc(27px*var(--s));
  font-weight:800;transition:border-color .15s,background .15s;box-shadow:var(--shadow);position:relative}
.tile:hover{border-color:var(--amber)}
.tile.pick{border-color:var(--teal);background:#E3F3F4}
.tile.used{opacity:.32;cursor:default}
.tile.right{border-color:var(--good);background:#E8F6ED}
.tile.wrong{border-color:var(--bad);background:#FBEBE9}
.tile .ord{position:absolute;top:-.55em;left:-.5em;width:1.9em;height:1.9em;border-radius:50%;
  background:var(--orange);color:#fff;display:grid;place-items:center;font-size:.62em;font-weight:900}
.tiles.ord{row-gap:calc(30px*var(--s))}
.tiles.ord .tile{font-size:calc(29px*var(--s));padding:calc(22px*var(--s)) calc(30px*var(--s))}

.bins{display:grid;gap:calc(18px*var(--s))}
.bin{background:#fff;border:4px dashed var(--line);border-radius:20px;padding:calc(16px*var(--s));
  cursor:pointer;display:flex;flex-direction:column;gap:.45em;transition:border-color .15s,background .15s}
.bin:hover,.bin.tgt{border-color:var(--teal);background:#EEF8F8}
.bin .bt{font-size:calc(27px*var(--s));font-weight:900;color:var(--teal)}
.bin .items{display:flex;flex-wrap:wrap;gap:calc(8px*var(--s));align-content:flex-start;flex:1 1 auto}
.chip{background:#FFF1DE;border:2px solid var(--amber);border-radius:12px;
  padding:.3em .7em;font-size:calc(21px*var(--s));font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;gap:.45em}
.chip .x{font-style:normal;width:1.5em;height:1.5em;border-radius:50%;background:rgba(18,52,59,.14);
  display:grid;place-items:center;font-size:.8em;cursor:pointer}
.chip .x:hover{background:var(--bad);color:#fff}
.chip.right{background:#E8F6ED;border-color:var(--good)}
.chip.wrong{background:#FBEBE9;border-color:var(--bad);text-decoration:line-through}
.chip.right .x,.chip.wrong .x{display:none}

.scard{position:relative;background:var(--card);border:4px solid var(--line);border-radius:20px;
  cursor:pointer;padding:calc(24px*var(--s)) calc(22px*var(--s));font-family:inherit;
  font-size:calc(31px*var(--s));font-weight:800;line-height:1.45;text-align:center;color:var(--ink);
  box-shadow:var(--shadow);transition:border-color .15s,background .15s,transform .15s;
  display:flex;align-items:center;justify-content:center}
.scard:hover{border-color:var(--amber);transform:translateY(-3px)}
.scard .no{position:absolute;top:-.5em;left:-.4em;width:1.8em;height:1.8em;border-radius:50%;
  background:var(--teal);color:#fff;display:grid;place-items:center;font-size:.68em;font-weight:900}
.scard::after{position:absolute;right:.4em;bottom:.3em;font-size:.62em;font-weight:900}
.scard.found{border-color:var(--bad);background:#FBEBE9}
.scard.found::after{content:"⚠ 有問題";color:var(--bad)}
.scard.found .no{background:var(--bad)}
.scard.safe{border-color:var(--teal);background:#E6F4F5}
.scard.safe::after{content:"👍 做得很好";color:var(--teal)}
.scard.miss{animation:shake .35s}
.scard.show{border-color:var(--amber);background:#FFF3D6}
.scard.show::after{content:"⚠ 有問題";color:#B9741C}
.scard.show .no{background:var(--amber)}

.story{background:var(--card);border:3px solid var(--line);border-radius:22px;
  padding:calc(28px*var(--s));font-size:calc(31px*var(--s)*var(--bs,1));font-weight:700;line-height:2.2;
  box-shadow:var(--shadow)}
.hot{cursor:pointer;border-bottom:4px solid #DCD2C0;padding:.05em .2em;border-radius:6px;transition:.15s}
.hot:hover{background:#FFF1DE;border-bottom-color:var(--amber)}
.hot.found{background:#D9F0E2;border-bottom-color:var(--good);color:#1C5B39}
.hot.miss{background:#FBEBE9;border-bottom-color:var(--bad);animation:shake .35s}
.hot.safe{background:#EAF2F3;border-bottom-color:var(--teal);color:#0A5A62}
.hot.show{background:#FFE9B8;border-bottom-color:var(--amber)}

/* ---------- 電影法 ---------- */
.mv-stage{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.mv-play,.mv-vote{flex:1 1 auto;display:flex;flex-direction:column;gap:calc(14px*var(--s));min-height:0}
.off{display:none!important}
.mv-clips{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:calc(16px*var(--s))}
.clip{background:var(--card);border:4px solid var(--line);border-radius:20px;cursor:pointer;
  padding:calc(20px*var(--s)) calc(26px*var(--s));font-size:calc(30px*var(--s));font-weight:800;
  line-height:1.35;text-align:left;font-family:inherit;box-shadow:var(--shadow);
  transition:border-color .15s,background .15s;display:flex;gap:.6em;align-items:center}
.clip:hover{border-color:var(--amber);background:#FFF9EF}
.clip .pl2{flex:0 0 auto;width:1.9em;height:1.9em;border-radius:50%;background:var(--orange);color:#fff;
  display:grid;place-items:center;font-size:.85em}
.clip.srch .pl2{background:var(--teal)}
.mv-tip{flex:0 0 auto;font-size:calc(22px*var(--s));font-weight:700;color:#8A8272;text-align:center}

/* 全螢幕影片視窗 */
#lb{position:fixed;inset:0;z-index:60;background:rgba(8,24,28,.96);display:none;
  flex-direction:column;padding:clamp(10px,1.6vh,22px)}
#lb.on{display:flex}
#lb .lb-top{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  gap:12px;color:#fff;font-size:clamp(15px,1.5vw,24px);font-weight:800;padding:0 6px 8px}
#lb .lb-frame{flex:1 1 auto;position:relative;border-radius:16px;overflow:hidden;background:#000}
#lb .lb-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#lb .lb-frame.vert{flex:1 1 auto;align-self:center;width:min(100%,calc((100vh - 130px)*9/16))}
#lb .lb-bar{flex:0 0 auto;display:flex;gap:12px;align-items:center;justify-content:center;
  flex-wrap:wrap;padding-top:10px;color:#BFE3E6;font-size:clamp(13px,1.3vw,20px);font-weight:700}
#lb button{border:none;border-radius:999px;cursor:pointer;font-family:inherit;font-weight:900;
  padding:.5em 1.3em;font-size:clamp(14px,1.4vw,22px)}
#lb .yt{background:var(--orange);color:#fff}
#lb .cl{background:rgba(255,255,255,.16);color:#fff}

.vote-q{font-size:calc(38px*var(--hs));font-weight:900;line-height:1.32}
.vote-opts{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:calc(16px*var(--s))}
.vo{background:var(--card);border:4px solid var(--line);border-radius:20px;cursor:pointer;
  padding:calc(22px*var(--s));font-size:calc(28px*var(--s));font-weight:800;line-height:1.45;
  box-shadow:var(--shadow);transition:border-color .15s,background .15s;position:relative;
  display:flex;flex-direction:column;justify-content:center;gap:.4em;font-family:inherit;text-align:left}
.vo:hover{border-color:var(--amber)}
.vo.on{background:linear-gradient(135deg,#FFF1DE,#FFE1B8);border-color:var(--orange)}
.vo .cntn{font-size:calc(40px*var(--s));font-weight:900;color:var(--orange)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.blanks{background:var(--card);border:3px solid var(--line);border-radius:22px;
  padding:calc(28px*var(--s));font-size:calc(31px*var(--s)*var(--bs,1));font-weight:700;line-height:2.45;box-shadow:var(--shadow)}
.bk{display:inline-block;min-width:5.2em;border-bottom:5px solid var(--orange);text-align:center;
  cursor:pointer;color:var(--orange);font-weight:900;padding:0 .2em}
.bk.sel{background:#FFF1DE}
.bk.right{color:var(--good);border-bottom-color:var(--good)}
.bk.wrong{color:var(--bad);border-bottom-color:var(--bad)}

.acts{display:flex;flex-wrap:wrap;gap:calc(14px*var(--s));align-items:center}
.btn{background:var(--teal);color:#fff;border:none;border-radius:999px;cursor:pointer;
  padding:.5em 1.4em;font-size:calc(25px*var(--s));font-weight:900;font-family:inherit;box-shadow:var(--shadow)}
.btn.gh{background:#fff;color:var(--teal);border:3px solid var(--teal)}
.btn.or{background:var(--orange)}
.btn:active{transform:translateY(2px)}
.cnt{font-size:calc(26px*var(--s));font-weight:900;color:var(--orange)}

/* ---------- section / reflect / pledge / score ---------- */
.sec-lead{font-size:calc(38px*var(--hs));font-weight:700;line-height:1.6;color:#3B4F55}
.sec-h{font-size:calc(84px*var(--hs));font-weight:900;line-height:1.12;color:var(--ink)}
.pl{background:var(--card);border:4px solid var(--line);border-radius:20px;cursor:pointer;
  padding:calc(24px*var(--s));font-size:calc(29px*var(--s));font-weight:800;line-height:1.4;
  box-shadow:var(--shadow);transition:border-color .15s,background .15s;position:relative;
  display:flex;align-items:center}
.pl:hover{border-color:var(--amber)}
.pl.on{background:linear-gradient(135deg,#FFF1DE,#FFE1B8);border-color:var(--orange)}
.pl.on::after{content:"✓";position:absolute;top:-.4em;right:-.25em;width:1.5em;height:1.5em;border-radius:50%;
  background:var(--orange);color:#fff;display:grid;place-items:center;font-size:.9em}
.plc-line{font-size:calc(30px*var(--s));font-weight:900;color:var(--orange);text-align:center}
.sc-em{font-size:calc(150px*var(--s));line-height:1}
.sc-big{font-size:calc(76px*var(--s));font-weight:900;color:var(--orange)}
.sc-t{font-size:calc(38px*var(--s));font-weight:800;color:#3B4F55}
.sc-p{font-size:calc(28px*var(--s));font-weight:700;color:#6B7A7E;line-height:1.7;margin-top:.5em}

/* ---------- chrome（固定尺寸，不隨頁面縮放） ---------- */
#chrome{position:fixed;left:0;right:0;bottom:0;height:clamp(48px,5.6vh,64px);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(14px,2vw,32px);background:rgba(18,52,59,.94);color:#fff;z-index:40}
#chrome .l,#chrome .r{display:flex;align-items:center;gap:clamp(6px,.9vw,14px)}
.cbtn{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:12px;cursor:pointer;
  padding:.45em .9em;font-size:clamp(13px,1.15vw,18px);font-weight:800;font-family:inherit}
.cbtn:hover{background:rgba(255,255,255,.3)}
.cbtn.on{background:var(--amber);color:var(--ink)}
#pg{font-size:clamp(13px,1.15vw,18px);font-weight:800;color:#BFE3E6}
#star{font-size:clamp(14px,1.25vw,20px);font-weight:900;color:var(--amber)}
#note{position:fixed;left:0;right:0;bottom:clamp(48px,5.6vh,64px);z-index:39;display:none;
  background:#FFF6E4;border-top:5px solid var(--amber);padding:clamp(10px,1.3vw,22px) clamp(16px,2.4vw,44px);
  font-size:clamp(14px,1.35vw,22px);font-weight:700;line-height:1.55;color:#5A4415;max-height:34vh;overflow:auto}
#note.on{display:block}
#note b{color:var(--orange)}
#timer{position:fixed;top:clamp(16px,2vh,28px);right:clamp(16px,2vw,32px);z-index:41;display:none;
  background:var(--orange);color:#fff;border-radius:20px;padding:.3em .9em;font-size:clamp(26px,3.4vw,58px);
  font-weight:900;box-shadow:var(--shadow)}
#timer.on{display:block}
#timer.low{background:var(--bad);animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- 目錄 ---------- */
#toc{position:fixed;inset:0;z-index:58;background:rgba(8,24,28,.82);display:none;place-items:center;padding:4vh 4vw}
#toc.on{display:grid}
.toc-card{background:var(--bg);border-radius:24px;width:min(980px,94vw);max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.45);overflow:hidden}
.toc-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;font-size:24px;font-weight:900;
  background:#fff;border-bottom:3px solid var(--line)}
.toc-h .btn{font-size:18px}
.toc-list{overflow:auto;padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toc-it{display:flex;gap:.6em;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;

.nt-it h3{font-size:22px;font-weight:900}
.nt-it h3 small{font-size:15px;color:#fff;background:var(--teal);border-radius:999px;padding:.15em .7em;margin-right:.5em;vertical-align:3px}
.nt-it .nn{font-size:18px;font-weight:600;line-height:1.7;color:#3B4F55;margin-top:.4em}
.nt-it .nn b{color:var(--orange)}
.nt-it .na{font-size:17px;font-weight:700;line-height:1.6;margin-top:.5em;background:#E8F6ED;border-radius:12px;padding:.5em .8em;color:#1C5B39}

/* ---------- 手機／小螢幕：改成可上下捲動，不硬塞進一個畫面 ---------- */
#chrome{padding-bottom:env(safe-area-inset-bottom)}

/* =========================================================================
   引擎
   ========================================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>s;
let idx=0, star=0, maxStar=0, noteOn=false;
const wrap=$("#slides");

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function ding(ok){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();
o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:200;g.gain.value=.08;o.start();
o.frequency.exponentialRampToValueAtTime(ok?1320:150,c.currentTime+.12);
g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.stop(c.currentTime+.26)}catch(e){}}
function addStar(n){star+=n;$("#star").textContent="⭐ "+star}

/* ---------- 版型 ---------- */
function head(s){
  let t="";
  if(s.tag) t+=`<span class="tag ${s.core?'core':''} ${/互動/.test(s.tag)?'q':''}">${s.tag}</span>`;
  t+=`<h2>${s.h||""}</h2>`;
  if(s.lead) t+=`<p class="lead">${s.lead}</p>`;
  return `<div class="hd">${t}</div>`;
}
function srcline(s){return s.src?`<div class="src">${s.src}</div>`:""}
function acts(html){return `<div class="acts">${html}</div>`}
const IDLE="👉 作答之後，這裡會出現說明";
const IDLE2="👆 點卡片作答，這裡會告訴你為什麼";
function fbbox(t,idle){const i=idle||IDLE;
  return `<div class="fb idle" data-idle="${i}" data-full="${String(t).replace(/"/g,"&quot;")}">${i}</div>`}

const R={
cover:s=>`<div class="numwrap"><div class="num">${s.num}</div></div>
  <div class="body" style="gap:.2em">
  <div class="kick">${s.kicker}</div>
  <h1>${s.h}</h1><div class="sub">${s.sub}</div><div class="meta">${s.meta}</div>
  <div class="swipe-tip">👉 手機上：左右滑動換頁，上下滑動看完整內容</div></div>`,

section:s=>`<div class="body" style="justify-content:center">
  ${s.tag?`<div><span class="tag ${s.core?'core':''}">${s.tag}</span></div>`:""}
  <h1 class="sec-h">${s.h}</h1>
  <p class="sec-lead">${s.lead||""}</p></div>`,

points:s=>head(s)+`<div class="body"><div class="grid g${s.cols||3}">`+
  s.items.map((it,i)=>`<div class="card ${i%3===1?'teal':i%3===2?'amber':''}">
    <div class="k">${it.k}</div><div class="v">${it.v}</div></div>`).join("")+
  `</div></div>`+srcline(s),

stats:s=>head(s)+`<div class="body"><div class="grid g${s.items.length>3?4:s.items.length}">`+
  s.items.map(it=>`<div class="stat"><div class="n${String(it.n).length>=4?' long':''}" data-to="${it.n}">0</div>
    <div class="u">${it.u}</div><div class="d">${it.d}</div></div>`).join("")+
  `</div></div>`+srcline(s),

flags:s=>head(s)+`<div class="body"><div class="grid g4">`+
  s.items.map(it=>`<div class="flag"><div class="c">${it.c}</div><div class="y">${it.y}</div>
    <div class="t">${it.t}</div></div>`).join("")+`</div></div>`+srcline(s),

choice:s=>head(s)+`<div class="body">
  <div class="qtext">${s.q}</div>
  <div class="opts">`+s.opts.map((o,i)=>
    `<button class="opt" data-i="${i}"><span class="ltr">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")+
  `</div></div>`+srcline(s),

fill:s=>head(s)+`<div class="body">
  <div class="tiles bank">`+shuffle(s.bank).map(w=>`<button class="tile" data-w="${w}">${w}</button>`).join("")+`</div>
  <div class="blanks"><div class="blanks-in">`+s.lines.map((l,i)=>
    `<div>${i+1}. ${l.pre}<span class="bk" data-i="${i}" data-a="${l.ans}">＿＿＿</span>${l.post}</div>`).join("")+
  `</div></div>`+acts(`<button class="btn ck">對答案</button><button class="btn gh rs">重來</button>`)+
  `</div>`+srcline(s),

order:s=>head(s)+`<div class="body">
  <div class="tiles ord">`+shuffle(s.items.map((x,i)=>({x,i}))).map(o=>
    `<button class="tile" data-i="${o.i}">${o.x}</button>`).join("")+`</div>
  `+acts(`<span class="cnt">已排 <b class="c0">0</b> / ${s.items.length}</span>
    <button class="btn ck">對答案</button><button class="btn gh rs">重來</button>`)+
  `</div>`+srcline(s),

spot:s=>head(s)+`<div class="body">
  <div class="grid ${s.cards.length%3===0?'g3':'g4'}">`+s.cards.map((g,i)=>
    `<button class="scard" data-i="${i}"><span class="no">${i+1}</span><span>${g.x}</span></button>`).join("")+`</div>
  `+acts(`<span class="cnt">找到 <b class="c0">0</b> / ${s.need}</span>
    <button class="btn gh sw">顯示答案</button>`)+
  fbbox("",IDLE2).replace("fb idle","fb why idle")+`</div>`+srcline(s),

sort:s=>head(s)+`<div class="body">
  <div class="tiles pool">`+shuffle(s.items.map((o,i)=>({...o,i}))).map(o=>
    `<button class="tile" data-i="${o.i}">${o.x}</button>`).join("")+`</div>
  <div class="grid g3 bins">`+s.bins.map(b=>
    `<div class="bin" data-b="${b.id}"><div class="bt">${b.t}</div><div class="items"></div></div>`).join("")+`</div>
  `+acts(`<button class="btn ck">對答案</button><button class="btn gh rs">重來</button>`)+
  `</div>`+srcline(s),

movie:s=>head(s)+`<div class="body">
  <div class="grid g3 mv-tasks">`+s.tasks.map((t,i)=>
    `<div class="card ${i%3===1?'teal':i%3===2?'amber':''}"><div class="k">${t.k}</div><div class="v">${t.v}</div></div>`).join("")+`</div>
  <div class="mv-stage">
    <div class="mv-play">
      <div class="mv-clips">`+s.clips.map(c=>
        `<button class="clip" data-id="${c.id||DECK.video.id}" data-st="${c.st||0}"><span class="pl2">▶</span><span>${c.t}</span></button>`).join("")+
        `<button class="clip srch" data-q="${s.search}"><span class="pl2">🔍</span><span>用關鍵字搜尋更多影片</span></button></div>
      <div class="mv-tip">點下去會跳出全螢幕播放（需要網路）。若顯示「影片播放器設定錯誤」，按視窗下方的「在 YouTube 開啟」即可。</div>
    </div>
    <div class="mv-vote off">
      <div class="vote-q">${s.vote.q}</div>
      <div class="vote-opts">`+s.vote.opts.map((o,i)=>
        `<button class="vo" data-i="${i}"><span>${o}</span><span class="cntn">0</span></button>`).join("")+`</div>
    </div>
  </div>
  <div class="acts">
    <button class="btn or tovote">看完了，來投票 ▶</button>
    <button class="btn gh toplay off">◀ 回到影片</button>
    <button class="btn gh rsv off">票數歸零</button>
  </div></div>`,

reflect:s=>head(s)+`<div class="body"><div class="grid g2">`+
  s.items.map((it,i)=>`<div class="card ${i%2?'teal':'amber'}">
    <div class="k">${it.k}</div><div class="v">${it.v}</div></div>`).join("")+
  `</div></div>`,

pledge:s=>head(s)+`<div class="body"><div class="grid g4">`+
  s.items.map(x=>`<div class="pl">${x}</div>`).join("")+
  `</div><div class="plc-line">全班已點亮 <span class="plc">0</span> 個承諾</div></div>`,

score:s=>head(s)+`<div class="body" style="text-align:center;justify-content:center">
  <div class="sc-em">🏆</div>
  <div class="sc-big">⭐ <span class="sc-n">0</span> / <span class="sc-m">0</span></div>
  <div class="sc-t"></div>
  <div class="sc-p">答對幾題不重要。<br>重要的是——下次買東西時，您會不會先翻到背面看一眼。</div>
  </div>`
};

/* ---------- 建立投影片 ---------- */
DECK.slides.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="slide"+(s.t==="cover"?" cover":"");
  d.dataset.i=i;
  d.innerHTML=(R[s.t]||R.points)(s);
  wrap.appendChild(d);
  bind(d,s,i);
});
DECK.slides.forEach(s=>{
  if(s.t==="choice")maxStar+=1;
  if(s.t==="fill")maxStar+=s.lines.length;
  if(s.t==="order")maxStar+=1;
  if(s.t==="spot")maxStar+=s.need;
  if(s.t==="sort")maxStar+=s.items.length;
});

/* ---------- 互動綁定 ---------- */
const reveal=el=>{ if(!el)return; el.innerHTML=el.dataset.full||el.innerHTML; el.classList.remove("idle") };
const relax=el=>{ if(!el)return; el.innerHTML=el.dataset.idle||""; el.classList.add("idle") };
function bind(d,s,i){
  const fb=$$(".fb",d).slice(-1)[0];

  if(s.t==="choice"){
    $$(".opt",d).forEach(b=>b.onclick=()=>{
      if(d.dataset.done)return; d.dataset.done=1;
      const k=+b.dataset.i, ok=k===s.ans;
      $$(".opt",d).forEach(x=>{x.classList.add("lock");
        if(+x.dataset.i===s.ans)x.classList.add("right");
        else if(x===b)x.classList.add("wrong")});
      if(ok)addStar(1); ding(ok);
      setTimeout(()=>d.classList.contains("on")&&showAns(ok?"🎉":"💡", ok?"答對了！":"正確答案是 "+"ABCD"[s.ans], s.fb),800);
    });
  }

  if(s.t==="fill"){
    let sel=null;
    const clr=()=>{$$(".tile",d).forEach(t=>t.classList.remove("pick"));sel=null};
    $$(".tile",d).forEach(t=>t.onclick=()=>{
      if(t.classList.contains("used"))return;
      clr(); t.classList.add("pick"); sel=t;
      const bk=$$(".bk",d).find(b=>!b.dataset.v);
      if(bk)put(bk);
    });
    $$(".bk",d).forEach(b=>b.onclick=()=>{ if(sel)put(b);
      else if(b.dataset.v){ const t=$$(".tile",d).find(x=>x.dataset.w===b.dataset.v);
        if(t)t.classList.remove("used"); b.dataset.v=""; b.textContent="＿＿＿"; b.className="bk"; } });
    function put(b){
      if(!sel)return;
      if(b.dataset.v){const old=$$(".tile",d).find(x=>x.dataset.w===b.dataset.v); if(old)old.classList.remove("used")}
      b.dataset.v=sel.dataset.w; b.textContent=sel.dataset.w; sel.classList.add("used"); clr();
    }
    $(".ck",d).onclick=()=>{
      if(d.dataset.done)return;
      let n=0; $$(".bk",d).forEach(b=>{const ok=b.dataset.v===b.dataset.a;
        b.classList.add(ok?"right":"wrong"); if(!ok)b.textContent=b.dataset.a; if(ok)n++});
      d.dataset.done=1; addStar(n); ding(n===s.lines.length);
      setTimeout(()=>d.classList.contains("on")&&showAns(n===s.lines.length?"🎉":"💪","答對 "+n+" / "+s.lines.length+" 格",s.fb),700);
    };
    $(".rs",d).onclick=()=>{ d.dataset.done="";
      $$(".bk",d).forEach(b=>{b.className="bk";b.dataset.v="";b.textContent="＿＿＿"});
      $$(".tile",d).forEach(t=>t.className="tile"); relax(fb); };
  }

  if(s.t==="order"){
    let seq=[];
    const paint=()=>{ $$(".tile",d).forEach(t=>{
        const p=seq.indexOf(+t.dataset.i);
        t.classList.toggle("pick",p>=0);
        const o=$(".ord",t); if(o)o.remove();
        if(p>=0)t.insertAdjacentHTML("beforeend",`<span class="ord">${p+1}</span>`);
      }); $(".c0",d).textContent=seq.length; };
    $$(".tile",d).forEach(t=>t.onclick=()=>{
      if(d.dataset.done)return;
      const k=+t.dataset.i; const p=seq.indexOf(k);
      if(p>=0)seq.splice(p,1); else seq.push(k); paint();
    });
    $(".ck",d).onclick=()=>{
      if(d.dataset.done)return; d.dataset.done=1;
      const ok=seq.length===s.items.length&&seq.every((v,n)=>v===n);
      $$(".tile",d).forEach(t=>{const k=+t.dataset.i;
        t.classList.remove("pick"); t.classList.add(seq.indexOf(k)===k?"right":"wrong");
        const o=$(".ord",t); if(o)o.textContent=k+1; else t.insertAdjacentHTML("beforeend",`<span class="ord">${k+1}</span>`)});
      if(ok)addStar(1); ding(ok);
      setTimeout(()=>d.classList.contains("on")&&showAns(ok?"🎉":"💪", ok?"順序完全正確！":"正確順序，看卡片上的號碼", s.fb),700);
    };
    $(".rs",d).onclick=()=>{ d.dataset.done=""; seq=[];
      $$(".tile",d).forEach(t=>{t.className="tile";const o=$(".ord",t);if(o)o.remove()});
      relax(fb); paint(); };
  }

  if(s.t==="spot"){
    const why=$(".why",d); let n=0;
    const L=s.cards.reduce((a,g)=>(g.x+(g.why||g.ok)).length>(a.x+(a.why||a.ok)).length?g:a);
    why.dataset.full='⚠️ <b>'+L.x+'</b>：'+(L.why||L.ok);
    $$(".scard",d).forEach(h=>h.onclick=()=>{
      if(d.dataset.done||h.classList.contains("found")||h.classList.contains("safe"))return;
      const g=s.cards[+h.dataset.i];
      if(g.d){                                   /* 誘答：其實是正確做法 */
        h.classList.add("miss"); ding(0);
        setTimeout(()=>{h.classList.remove("miss");h.classList.add("safe")},350);
        why.innerHTML="👍 <b>"+g.x+"</b>：這樣做很好——"+g.ok;
        why.classList.remove("idle"); return;
      }
      h.classList.add("found"); n++; addStar(1); ding(1);
      $(".c0",d).textContent=n;
      why.innerHTML="⚠️ <b>"+g.x+"</b>："+g.why;
      why.classList.remove("idle");
      if(n>=s.need){d.dataset.done=1;
        setTimeout(()=>d.classList.contains("on")&&showAns("🏆","太棒了，"+s.need+" 個全部找到！",s.fb),1100)}
    });
    $(".sw",d).onclick=()=>{
      $$(".scard",d).forEach(h=>{const g=s.cards[+h.dataset.i];
        if(g.w&&!h.classList.contains("found"))h.classList.add("show")});
      d.dataset.done=1; showAns("📖","答案都在這裡",s.fb);
    };
  }

  if(s.t==="sort"){
    let sel=null;
    $$(".pool .tile",d).forEach(t=>t.onclick=()=>{
      if(d.dataset.done||t.classList.contains("used"))return;
      $$(".tile",d).forEach(x=>x.classList.remove("pick"));
      t.classList.add("pick"); sel=t;
    });
    $$(".bin",d).forEach(b=>b.onclick=()=>{
      if(d.dataset.done||!sel)return;
      const k=+sel.dataset.i;
      const c=document.createElement("span");
      c.className="chip"; c.dataset.i=k; c.dataset.b=b.dataset.b;
      c.innerHTML=`<span>${s.items[k].x}</span><i class="x" title="拿回來">✕</i>`;
      $(".x",c).onclick=(e)=>{ if(d.dataset.done||sel)return; e.stopPropagation();
        c.remove(); $$(".pool .tile",d).find(x=>+x.dataset.i===k).classList.remove("used")};
      $(".items",b).appendChild(c);
      sel.classList.add("used"); sel.classList.remove("pick"); sel=null;
    });
    $(".ck",d).onclick=()=>{
      if(d.dataset.done)return; d.dataset.done=1;
      let n=0; $$(".chip",d).forEach(c=>{const ok=s.items[+c.dataset.i].b===c.dataset.b;
        c.classList.add(ok?"right":"wrong"); if(ok)n++});
      addStar(n); ding(n===s.items.length);
      setTimeout(()=>d.classList.contains("on")&&showAns(n===s.items.length?"🎉":"💪","分對 "+n+" / "+s.items.length+" 張",s.fb),700);
    };
    $(".rs",d).onclick=()=>{ d.dataset.done=""; sel=null;
      $$(".chip",d).forEach(c=>c.remove());
      $$(".tile",d).forEach(t=>t.className="tile"); relax(fb); };
  }

  if(s.t==="movie"){
    const play=$(".mv-play",d), vote=$(".mv-vote",d);
    const bV=$(".tovote",d), bP=$(".toplay",d), bR=$(".rsv",d);
    $$(".clip",d).forEach(c=>c.onclick=()=>{
      if(c.classList.contains("srch")){
        window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(c.dataset.q),"_blank");
        return;
      }
      openLB(c.dataset.id, c.textContent.trim(), +c.dataset.st);
    });
    const mode=v=>{ play.classList.toggle("off",v); vote.classList.toggle("off",!v);
      bV.classList.toggle("off",v); bP.classList.toggle("off",!v); bR.classList.toggle("off",!v); fit(d); };
    bV.onclick=()=>mode(1); bP.onclick=()=>mode(0);
    bR.onclick=()=>$$(".vo",d).forEach(v=>{v.classList.remove("on");$(".cntn",v).textContent="0"});
    $$(".vo",d).forEach(v=>v.onclick=()=>{                /* 只計票，不判對錯 */
      const c=$(".cntn",v); c.textContent=(+c.textContent)+1; v.classList.add("on"); ding(1);
    });
  }

  if(s.t==="pledge"){
    $$(".pl",d).forEach(p=>p.onclick=()=>{
      p.classList.toggle("on"); ding(1);
      $(".plc",d).textContent=$$(".pl.on",d).length;
    });
  }
}


/* ---------- 自動縮放：把每一頁的內容撐滿畫面 ----------
   量測時會先「假裝」回饋框已展開（找錯題用最長的一則解說），
   所以揭曉答案時字級不會突然縮小，投影畫面是穩定的。            */
function isMob(){return innerWidth<=820||innerHeight<=500}
function fit(d){
  if(!d||d.classList.contains("cover")){if(d)d.style.setProperty("--s",1);return}
  if(document.body.classList.contains("mob")){             /* 手機：字級依寬度定，內容可以上下捲 */
    $$(".fb",d).forEach(f=>f.style.minHeight="");
    let m=Math.max(.58,Math.min(1,innerWidth/560,innerHeight/470));
    d.style.setProperty("--s",m);
    let g=0; while(d.scrollWidth>d.clientWidth+1&&m>.5&&g++<12){m*=.95;d.style.setProperty("--s",m)}
    return;
  }
  const fbs=$$(".fb",d), ns=$$(".n",d);
  const oldHTML=fbs.map(f=>f.innerHTML), oldN=ns.map(e=>e.textContent);
  ns.forEach(e=>{if(e.dataset.to)e.textContent=e.dataset.to});
  const wasIdle=fbs.map(f=>f.classList.contains("idle"));
  fbs.forEach(f=>{ f.style.minHeight=""; f.classList.remove("idle");
    if(f.dataset.full)f.innerHTML=f.dataset.full });
  let lo=.45, hi=2.3, best=.45;
  for(let i=0;i<14;i++){
    const m=(lo+hi)/2;
    d.style.setProperty("--s",m);
    if(d.scrollHeight<=d.clientHeight+1 && d.scrollWidth<=d.clientWidth+1){best=m;lo=m} else hi=m;
  }
  d.style.setProperty("--s",best);
  fbs.forEach((f,i)=>{ f.style.minHeight=f.offsetHeight+"px"; f.innerHTML=oldHTML[i];
    if(wasIdle[i])f.classList.add("idle") });
  ns.forEach((e,i)=>e.textContent=oldN[i]);
  let g=0; while(d.scrollHeight>d.clientHeight+1 && best>.5 && g++<10){
    best*=.97; d.style.setProperty("--s",best); }
}
/* 互動後若內容變高（例如分類題把卡片放進籃子），再收一次 */
document.addEventListener("click",()=>setTimeout(()=>{
  const d=$(".slide.on"); if(!d||d.classList.contains("cover")||document.body.classList.contains("mob"))return;
  if(d.scrollHeight>d.clientHeight+2)fit(d);
},0));
let _rz; addEventListener("resize",()=>{clearTimeout(_rz);_rz=setTimeout(()=>{document.body.classList.toggle("mob",isMob());fit($(".slide.on"))},140)});


/* ---------- 答案彈窗 ---------- */
const ANS=$("#ans");
function showAns(ico,title,html){
  $(".ans-ico",ANS).textContent=ico; $(".ans-t",ANS).textContent=title;
  $(".ans-b",ANS).innerHTML=html; ANS.classList.add("on");
}
function hideAns(){ANS.classList.remove("on")}
$(".ans-ok",ANS).onclick=hideAns;
ANS.addEventListener("click",e=>{ if(e.target===ANS)hideAns() });

/* ---------- 全螢幕影片視窗 ---------- */
const LB=$("#lb"); let lbId="", lbSt=0;
function openLB(id,title,st){
  lbId=id; lbSt=st||0; $(".lb-t",LB).textContent=title||"";
  $(".lb-frame",LB).classList.toggle("vert",!!(DECK.video&&DECK.video.vertical));
  $(".lb-frame",LB).innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+
    '?rel=0&autoplay=1&playsinline=1'+(lbSt?'&start='+lbSt:'')+'" title="'+(title||"影片").replace(/"/g,"")+'" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  LB.classList.add("on");
}
function closeLB(){ LB.classList.remove("on"); $(".lb-frame",LB).innerHTML=""; }
$(".cl",LB).onclick=closeLB;
$(".yt",LB).onclick=()=>window.open("https://youtu.be/"+lbId+(lbSt?"?t="+lbSt:""),"_blank");
LB.addEventListener("click",e=>{ if(e.target===LB)closeLB() });

/* ---------- 文字框自動填滿：先放大字級，再用行距補滿剩餘 ---------- */
function fillBoxes(d){
  $$(".story,.blanks",d).forEach(box=>{
    const inner=box.firstElementChild; if(!inner)return;
    inner.style.lineHeight=""; box.style.setProperty("--bs",1);
    const cs=getComputedStyle(box);
    const avail=box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    if(avail<=20)return;
    let lo=.55, hi=2.8, best=.55;
    for(let i=0;i<12;i++){ const m=(lo+hi)/2; box.style.setProperty("--bs",m);
      if(inner.scrollHeight<=avail-2){best=m;lo=m} else hi=m; }
    box.style.setProperty("--bs",best);
    const now=inner.scrollHeight;
    const fs=parseFloat(getComputedStyle(inner).fontSize);
    const base=parseFloat(getComputedStyle(inner).lineHeight)/fs;
    if(now>0){ const k=Math.min(base*1.45, base*(avail/now)*0.99); if(k>base)inner.style.lineHeight=k; }
  });
}

/* ---------- 導覽 ---------- */
function go(n){
  idx=Math.max(0,Math.min(DECK.slides.length-1,n));
  $$(".slide").forEach((d,i)=>d.classList.toggle("on",i===idx));
  $("#barfill").style.width=((idx+1)/DECK.slides.length*100)+"%";
  $("#pg").textContent=(idx+1)+" / "+DECK.slides.length;
  const s=DECK.slides[idx], d=$$(".slide")[idx];
  closeLB(); hideAns();
  $("#note").innerHTML=s.note?("🎙 <b>講師提示</b>　"+s.note):"（本頁無提示）";
  $("#note").classList.toggle("on",noteOn);
  if(s.t==="score"){
    $(".sc-n",d).textContent=star; $(".sc-m",d).textContent=maxStar;
    const r=maxStar?star/maxStar:0;
    $(".sc-t",d).textContent = r>=.9?"太厲害了！您就是社區的標籤小偵探 🔍"
      : r>=.6?"很棒！這些觀念已經在您心裡了 👍" : "沒關係，記住一句就夠：買東西先翻到背面 🏷️";
    $(".sc-em",d).textContent = r>=.9?"🏆":r>=.6?"🎉":"🌱";
  }
  fit(d);
  if(s.t==="stats")countUp(d);
  stopTimer();
}
$("#prev").onclick=()=>go(idx-1);
$("#next").onclick=()=>go(idx+1);
$("#nbtn").onclick=()=>{noteOn=!noteOn;$("#note").classList.toggle("on",noteOn);$("#nbtn").classList.toggle("on",noteOn)};
$("#fbtn").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
const TOC=$("#toc"), strip=x=>String(x||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
function buildToc(){
  $(".toc-list",TOC).innerHTML=DECK.slides.map((s,k)=>`<button class="toc-it ${k===idx?'cur':''}" data-k="${k}"><i>${k+1}</i>${strip(s.h)}</button>`).join("");
  $$(".toc-it",TOC).forEach(b=>b.onclick=()=>{TOC.classList.remove("on");go(+b.dataset.k)});
}
$("#hbtn").onclick=()=>{buildToc();TOC.classList.add("on")};
$(".toc-x",TOC).onclick=()=>TOC.classList.remove("on");
TOC.addEventListener("click",e=>{ if(e.target===TOC)TOC.classList.remove("on") });

/* 手機：左右滑動換頁（上下捲動不受影響） */
let tx=0, ty=0;
wrap.addEventListener("touchstart",e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
wrap.addEventListener("touchend",e=>{
  if(ANS.classList.contains("on")||LB.classList.contains("on"))return;
  const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(idx+(dx<0?1:-1));
},{passive:true});

/* 講師手冊：每頁的帶法與答案，一頁看完（可列印） */
function renderNotes(){
  document.body.classList.add("notes");
  const v=DECK.video&&DECK.video.id;
  let h=`<div class="nt-wrap"><h1>📖 講師手冊｜${DECK.title}</h1>
    <div class="nt-top">影片：${v&&v!=="VIDEO_ID"?`<a href="https://youtu.be/${v}" target="_blank" rel="noopener">https://youtu.be/${v}</a>`:"（尚未設定）"}<br>
    互動簡報：<a href="./">回到簡報</a>　·　投影時按 N 也可以看到每頁提示</div>`;
  DECK.slides.forEach((s,k)=>{
    let a="";
    if(s.t==="choice")a="✅ 答案："+"ABCD"[s.ans]+"　"+s.opts[s.ans];
    if(s.t==="fill")a="✅ 答案："+s.lines.map((l,i)=>(i+1)+". "+l.ans).join("　");
    if(s.t==="order")a="✅ 正確順序："+s.items.map((x,i)=>(i+1)+". "+x).join("　");
    if(s.t==="spot")a="✅ 有問題的："+s.cards.map((c,i)=>c.w?(i+1)+" "+c.x:"").filter(Boolean).join("、");
    if(s.t==="sort")a="✅ "+s.bins.map(b=>strip(b.t)+"："+s.items.filter(x=>x.b===b.id).map(x=>x.x).join("、")).join("　｜　");
    if(s.t==="movie")a="🗳 投票沒有標準答案，只計票";
    h+=`<div class="nt-it"><h3><small>${k+1}</small>${strip(s.h)}</h3><div class="nn">${s.note||""}</div>${a?`<div class="na">${a}</div>`:""}</div>`;
  });
  document.body.innerHTML=h+`</div>`;
}
document.addEventListener("keydown",e=>{
  if(location.hash==="#notes")return;
  if(TOC.classList.contains("on")){ if(e.key==="Escape")TOC.classList.remove("on"); return; }
  if(ANS.classList.contains("on")){
    if(["Escape","Enter"," ","ArrowRight","PageDown"].includes(e.key)){e.preventDefault();hideAns()}
    return; }
  if(LB.classList.contains("on")){ if(e.key==="Escape"){e.preventDefault();closeLB()} return; }
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(idx+1)}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(idx-1)}
  else if(e.key==="Home")go(0); else if(e.key==="End")go(DECK.slides.length-1);
  else if(e.key==="n"||e.key==="N")$("#nbtn").click();
  else if(e.key==="f"||e.key==="F")$("#fbtn").click();
  else if(e.key==="t"||e.key==="T")$("#tbtn").click();
});

/* 數字動畫 */
function countUp(d){
  $$(".n",d).forEach(el=>{
    const to=parseFloat(el.dataset.to), dec=(el.dataset.to.split(".")[1]||"").length;
    let t0=null;
    const step=ts=>{ if(!t0)t0=ts; const p=Math.min(1,(ts-t0)/900);
      el.textContent=(to*(1-Math.pow(1-p,3))).toFixed(dec);
      if(p<1)requestAnimationFrame(step); else el.textContent=el.dataset.to;};
    requestAnimationFrame(step);
  });
}

/* 搶答計時器（講師自行決定要不要用） */
let tid=null;
function stopTimer(){clearInterval(tid);tid=null;$("#timer").classList.remove("on","low")}
$("#tbtn").onclick=()=>{
  if(tid){stopTimer();return}
  let n=30; const el=$("#timer"); el.textContent=n; el.classList.add("on");
  tid=setInterval(()=>{ n--; el.textContent=n;
    el.classList.toggle("low",n<=5);
    if(n<=0){ding(0);stopTimer()} },1000);
};

addEventListener("hashchange",()=>location.reload());
document.body.classList.toggle("mob",isMob());
if(location.hash==="#notes")renderNotes(); else { go(0); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fit($(".slide.on"))); }
</script>
